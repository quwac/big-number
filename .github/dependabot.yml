version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
