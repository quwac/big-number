name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verification_required: ${{ steps.source.outputs.verification_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Detect source changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test_paths=(
            src
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
            kotlin-js-store
            mise.toml
            mise.lock
            config/detekt
            .github/dependabot.yml
            .github/workflows
          )

          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Unable to determine the base commit; running verification."
            echo "verification_required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$GITHUB_SHA" -- "${test_paths[@]}"; then
            echo "No source or verification inputs changed; skipping verification."
            echo "verification_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source or verification inputs changed; running verification."
            echo "verification_required=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: ${{ needs.changes.outputs.verification_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked betterleaks jactionlint java pinact zizmor
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew detekt
      - run: mise run security
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}

  linux-tests:
    needs: changes
    if: ${{ needs.changes.outputs.verification_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew allTests publishToMavenLocal

  apple-tests:
    needs: changes
    if: ${{ needs.changes.outputs.verification_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.8.11'
          sha256: c846efad1f468356b3b1e144db0241e7b5374a692e7b571f2e8d6772e82dc3c0
          install_args: --locked java
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test

  windows-tests:
    needs: changes
    if: ${{ needs.changes.outputs.verification_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.8.11'
          sha256: 31e3c50b90436b5e6d8bf79648106969182ffb049fbaf694a2cf83c8f51dc775
          install_args: --locked java
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew.bat mingwX64Test

  test:
    if: ${{ always() }}
    needs: [changes, quality, linux-tests, apple-tests, windows-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification jobs
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.quality.result }}" = success || test "${{ needs.quality.result }}" = skipped
          test "${{ needs.linux-tests.result }}" = success || test "${{ needs.linux-tests.result }}" = skipped
          test "${{ needs.apple-tests.result }}" = success || test "${{ needs.apple-tests.result }}" = skipped
          test "${{ needs.windows-tests.result }}" = success || test "${{ needs.windows-tests.result }}" = skipped
