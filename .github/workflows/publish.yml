name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.8.11'
          sha256: c846efad1f468356b3b1e144db0241e7b5374a692e7b571f2e8d6772e82dc3c0
          install_args: --locked betterleaks jactionlint java pinact zizmor
          cache: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag in v1.0.0 format" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: source
        name: Detect source changes
        shell: bash
        run: |
          test_paths=(
            src
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
            kotlin-js-store
            mise.toml
            mise.lock
            config/detekt
            .github/dependabot.yml
            .github/workflows
          )
          release_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"

          if ! base_commit="$(git rev-parse "$release_commit^" 2>/dev/null)"; then
            echo "Release has no parent commit; running verification."
            echo "verification_required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base_commit" "$release_commit" -- "${test_paths[@]}"; then
            echo "No source or verification inputs changed; skipping verification."
            echo "verification_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source or verification inputs changed; running verification."
            echo "verification_required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify security and static analysis
        if: ${{ steps.source.outputs.verification_required == 'true' }}
        run: |
          mise run security
          ./gradlew detekt
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
      - name: Test and verify local publication
        if: ${{ steps.source.outputs.verification_required == 'true' }}
        run: ./gradlew allTests publishToMavenLocal --no-configuration-cache
      - name: Publish to Maven Central
        shell: bash
        run: |
          required_variables=(
            ORG_GRADLE_PROJECT_mavenCentralUsername
            ORG_GRADLE_PROJECT_mavenCentralPassword
            ORG_GRADLE_PROJECT_signingInMemoryKey
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          )
          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required environment variable: $variable" >&2
              exit 1
            fi
          done
          ./gradlew publishAndReleaseToMavenCentral \
            -Pversion="${GITHUB_REF_NAME#v}" \
            --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $GITHUB_REF_NAME"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
